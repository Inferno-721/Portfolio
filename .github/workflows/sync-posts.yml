name: Sync posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch posts
        run: pnpm posts:sync
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit changes
        if: always()
        run: |
          git config user.name "post-sync"
          git config user.email "post-sync@users.noreply.github.com"
          git add src/features/writing/data/posts.json
          git diff --cached --quiet || (git commit -m "Sync posts" && git push)
